name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync locked dependencies
        run: uv sync --frozen --all-extras

      - name: Repository hygiene (pre-commit)
        run: uv run pre-commit run --all-files

      - name: Enforce test markers
        run: uv run python scripts/check_test_markers.py

      - name: Test (unit + smoke, 8-min budget)
        timeout-minutes: 8
        run: >
          uv run pytest -m "unit or smoke"
          --junitxml=test-results.xml
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: ignore
